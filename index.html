#sideVignette{position:absolute;z-index:1;inset:0;background:linear-gradient(90deg,#01070a70,transparent 26%,transparent 74%,#01070a70);pointer-events:none}
#meadowFill{position:absolute;z-index:2;inset:0;pointer-events:none;overflow:hidden}
#meadowFill::before{content:'';position:absolute;left:-6%;right:-6%;bottom:-1%;height:25%;background:radial-gradient(ellipse at 50% 100%,rgba(7,22,20,.92) 0 34%,rgba(7,22,20,.74) 34%,rgba(7,22,20,0) 72%),repeating-linear-gradient(96deg,rgba(18,46,39,.62) 0 2px,transparent 2px 16px),repeating-linear-gradient(84deg,transparent 0 13px,rgba(26,67,57,.28) 13px 15px,transparent 15px 30px);mask-image:linear-gradient(to top,#000 0 72%,transparent 100%);opacity:.98}
#meadowFill::after{content:'';position:absolute;left:-7%;right:-7%;bottom:10%;height:34%;background:radial-gradient(circle at 12% 100%,rgba(13,35,29,.78),transparent 36%),radial-gradient(circle at 86% 100%,rgba(13,35,29,.78),transparent 36%),radial-gradient(circle at 50% 100%,rgba(14,39,34,.48),transparent 32%);filter:blur(10px);opacity:.85}
.grassCluster{position:absolute;bottom:-3%;width:27%;height:34%;opacity:.96;filter:blur(.2px)}
.grassCluster.left{left:-2%;transform:scaleX(1.05)}
.grassCluster.right{right:-2%;transform:scaleX(-1.07)}
.grassCluster::before,.grassCluster::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(82deg,transparent 0 10px,rgba(27,67,55,.58) 10px 12px,transparent 12px 24px),repeating-linear-gradient(97deg,transparent 0 13px,rgba(10,31,24,.78) 13px 15px,transparent 15px 28px);mask-image:linear-gradient(to top,#000 0 72%,transparent 100%)}
.grassCluster::after{transform:translateY(-10%) scale(1.08);opacity:.45;filter:blur(3px)}
#photoFrame{position:absolute;top:0;left:50%;height:100%;aspect-ratio:736 / 1308;width:auto;transform:translateX(-50%);z-index:2;pointer-events:none}
#photoBase{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}
#butterfliesBack,#butterfliesFront,#rainLayer{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
#butterfliesBack{z-index:3}
#petalRegion{position:absolute;z-index:4;left:30.7065217%;top:56.880734%;width:29.891304%;height:13.83792%;pointer-events:none}
#petalRegion img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}
#petalRegion .stage{opacity:0;will-change:opacity}
#world.birthday .stage1{animation:petalChange 2.65s .1s linear forwards}
#world.birthday .stage2{animation:petalChange 2.65s 2.4s linear forwards}
#world.birthday .stage3{animation:petalChange 2.65s 4.7s linear forwards}
#world.birthday .stage4{animation:petalChange 3.2s 7.0s linear forwards}
@keyframes petalChange{from{opacity:0}to{opacity:1}}
#butterfliesFront{z-index:5}
#rainLayer{z-index:6;opacity:.78}
#clockWrap{position:absolute;z-index:9;top:max(23px,env(safe-area-inset-top) + 15px);left:50%;width:calc(100% - 28px);transform:translateX(-50%);display:flex;justify-content:center;transition:opacity 1.8s ease,transform 1.8s ease}
#world.birthday #clockWrap{opacity:0;transform:translate(-50%,-18px);pointer-events:none}
.clock{display:flex;align-items:center;gap:clamp(5px,1.9vw,16px);padding:12px clamp(14px,3vw,22px);border:1px solid #abdce72e;border-radius:99px;background:linear-gradient(180deg,#031320b3,#0715218a);box-shadow:0 10px 35px #0006,inset 0 1px 0 #ffffff12;backdrop-filter:blur(12px)}
.clockUnit{min-width:clamp(42px,7vw,65px);text-align:center}
.clockNumber{font:400 clamp(27px,4.4vw,45px)/.97 'Cormorant Garamond',Georgia,serif;letter-spacing:.015em;color:#e9f8ff;text-shadow:0 0 22px #8bd9ff31;font-variant-numeric:tabular-nums}
.clockLabel{display:block;font:400 9px 'DM Sans',Arial,sans-serif;letter-spacing:.18em;color:#b8d8e4;margin-top:6px}
.clockDivider{font:400 19px 'Cormorant Garamond',serif;align-self:center;margin-top:-7px;color:#94b6c5a8}
#greeting{position:absolute;z-index:9;top:29%;left:50%;right:auto;width:min(92vw,780px);opacity:0;transform:translate(-50%,20px) scale(.97);text-align:center;pointer-events:none;transition:opacity 2.2s ease,transform 3.4s cubic-bezier(.2,.7,.2,1)}
#world.birthday #greeting{opacity:1;transform:translate(-50%,0) scale(1);transition-delay:4.1s}
#greeting h1{margin:0;color:#ffe1f1;font:400 clamp(50px,6vw,82px)/.88 'Great Vibes','Segoe Script','Brush Script MT','Lucida Handwriting',cursive;text-shadow:0 0 19px #ffcff966,0 0 52px #e49aff33;letter-spacing:.005em}
#greeting h1 span{display:block;white-space:nowrap}
#greeting .name{font-size:1.13em;padding-top:.07em}
#demoPanel{position:absolute;z-index:20;display:none;left:50%;bottom:max(16px,env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);width:min(95vw,700px);padding:10px 12px;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;border-radius:17px;background:#03101ce0;border:1px solid #acc9dc46;box-shadow:0 10px 32px #0009;backdrop-filter:blur(14px)}
#world.demo #demoPanel{display:flex}
#demoPanel button,#demoPanel input{padding:9px 12px;background:#142b3b;color:#e9f6ff;border:1px solid #93b9cf66;border-radius:9px;font:500 12px 'DM Sans',Arial,sans-serif;cursor:pointer}
#demoPanel input{width:173px}
#demoPanel button:focus-visible,#demoPanel input:focus-visible{outline:2px solid #b5e7ff;outline-offset:2px}
#demoPanel button:hover{background:#254d62}
#demoPanel label{font-size:10px;letter-spacing:.12em;color:#b6d0dc;margin-right:4px}
@media(max-width:630px){
 #clockWrap{top:max(14px,env(safe-area-inset-top) + 10px)}
 .clock{gap:7px;padding:10px 12px}
 .clockUnit{min-width:36px}
 .clockNumber{font-size:clamp(25px,6.6vw,34px)}
 .clockLabel{font-size:8px;letter-spacing:.12em}
 #greeting{top:31%;width:96vw}
 #greeting h1{font-size:clamp(41px,10.8vw,63px)}
 #demoPanel{bottom:max(11px,env(safe-area-inset-bottom) + 7px);gap:6px;padding:9px}
 #demoPanel label{display:none}
 #demoPanel input,#demoPanel button{font-size:11px;padding:9px 8px}
}
@media(prefers-reduced-motion:reduce){
 #world.birthday .stage1,#world.birthday .stage2,#world.birthday .stage3{animation:none}
 #world.birthday .stage4{opacity:1;animation:none}
 #greeting,#clockWrap{transition:none!important}
}
</style>
</head>

  </div>
  <canvas id="butterfliesFront" aria-hidden="true"></canvas>
  <canvas id="rainLayer" aria-hidden="true"></canvas>
  <div id="clockWrap" role="timer" aria-label="Tiempo hasta el cumpleaños de Karla">
    <div class="clock">
      <div class="clockUnit"><span class="clockNumber" id="days">00</span><span class="clockLabel">DÍAS</span></div><span class="clockDivider">·</span>
      <div class="clockUnit"><span class="clockNumber" id="hours">00</span><span class="clockLabel">HORAS</span></div><span class="clockDivider">·</span>
      <div class="clockUnit"><span class="clockNumber" id="minutes">00</span><span class="clockLabel">MIN</span></div><span class="clockDivider">·</span>
      <div class="clockUnit"><span class="clockNumber" id="seconds">00</span><span class="clockLabel">SEG</span></div>
    </div>
  </div>
  <div id="greeting" aria-live="polite"><h1><span>Feliz Cumpleaños</span><span class="name">Karla</span></h1></div>
  <div id="demoPanel">
    <label for="dateControl">PRUEBA</label><input id="dateControl" type="datetime-local" aria-label="Fecha y hora en Lima" />
    <button id="setDate">Aplicar fecha</button><button id="trigger">Ver cumpleaños</button><button id="reset">Reiniciar</button>
  </div>
</main>
<script>
(()=>{'use strict';
const DEMO=false;
const DATE_PERU='2026-10-29T00:00:00-05:00';
const root=document.getElementById('world');
const $=id=>document.getElementById(id);
const behind=$('butterfliesBack'),front=$('butterfliesFront'),rain=$('rainLayer');
const bctx=behind.getContext('2d'),fctx=front.getContext('2d'),rctx=rain.getContext('2d');
const DPR_LIMIT=1.8;
const PI=Math.PI,TAU=PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
let deadline=DEMO?Date.now()+40000:new Date(DATE_PERU).getTime();
let birthday=false,birthdayAt=0;
let W=0,H=0,photoX=0,photoW=0,photoY=0,photoH=0,DPR=1;
let butterflies=[],droplets=[];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function initScene(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,DPR_LIMIT);
 const r=$('photoFrame').getBoundingClientRect();photoX=r.x;photoY=r.y;photoW=r.width;photoH=r.height;
 for(let canvas of [behind,front,rain]){canvas.width=Math.ceil(W*DPR);canvas.height=Math.ceil(H*DPR);canvas.getContext('2d').setTransform(DPR,0,0,DPR,0,0)}
 // Carefully restrained population; actual wing flapping and spatial depth.
 butterflies=[
   {x:.12,y:.36,size:6.3,phase:.9,speed:.25,wing:6.7,depth:.56,front:false},
   {x:.16,y:.43,size:7,phase:.2,speed:.31,wing:7.4,depth:.63,front:false},
   {x:.24,y:.60,size:6.8,phase:2.8,speed:.29,wing:7.2,depth:.66,front:false},
   {x:.75,y:.40,size:8,phase:1.8,speed:.27,wing:8.2,depth:.72,front:false},
   {x:.84,y:.29,size:6.6,phase:4.2,speed:.24,wing:6.8,depth:.58,front:false},
   {x:.31,y:.55,size:8.2,phase:3.2,speed:.34,wing:8.7,depth:.71,front:false},
   {x:.58,y:.48,size:7.2,phase:4.7,speed:.28,wing:7.9,depth:.69,front:false},
   {x:.42,y:.67,size:8.8,phase:1.2,speed:.30,wing:9.2,depth:.78,front:false},
   {x:.17,y:.79,size:13.4,phase:5.3,speed:.36,wing:12.2,depth:1.24,front:true},
   {x:.26,y:.73,size:11.5,phase:2.1,speed:.39,wing:10.8,depth:1.0,front:true},
   {x:.69,y:.57,size:10.3,phase:5.9,speed:.31,wing:10.3,depth:1.0,front:true},
   {x:.55,y:.79,size:12.4,phase:3.8,speed:.35,wing:11.4,depth:1.2,front:true},
   {x:.77,y:.72,size:14.1,phase:.7,speed:.33,wing:12.6,depth:1.26,front:true},
   {x:.60,y:.87,size:11.1,phase:2.4,speed:.37,wing:10.4,depth:1.1,front:true},
 ].map((b,i)=>({...b,seed:i}));
 const count=Math.round(clamp(W*H/19000,32,65));
 droplets=Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,len:lerp(8,20,Math.random()),speed:lerp(50,105,Math.random()),alpha:lerp(.10,.24,Math.random())}));
}
window.addEventListener('resize',initScene,{passive:true});
function mixRGB(a,b,t,alpha){return `rgba(${lerp(a[0],b[0],t)|0},${lerp(a[1],b[1],t)|0},${lerp(a[2],b[2],t)|0},${alpha})`}
const cyan=[87,218,255],pink=[236,117,236],white=[236,253,255],warmWhite=[255,226,245];
function butterfly(ctx,b,t,colorProgress){
 const wander=Math.min(1,photoW/500);
 const x=photoX+photoW*b.x+Math.sin(t*b.speed+b.phase)*photoW*.052+Math.sin(t*.16+b.phase)*photoW*.018;
 const y=photoY+photoH*b.y+Math.cos(t*b.speed*.82+b.phase)*photoH*.030+Math.sin(t*.4+b.phase)*photoH*.011;
 const factor=clamp(photoW/460,.66,1.38);
 const s=b.size*factor*b.depth;
 const flap=reduced?.8:(.22+.78*Math.abs(Math.sin(t*b.wing+b.phase)));
 const c=mixRGB(cyan,pink,colorProgress,b.front?.86:.61);
 const pale=mixRGB(white,warmWhite,colorProgress,b.front?.92:.70);
 ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*.47+b.phase)*.13);
 ctx.globalCompositeOperation='screen';
 // Light bloom, intentionally subtle to keep the photography in focus.
 const glow=ctx.createRadialGradient(0,0,1,0,0,s*2.8);
 glow.addColorStop(0,mixRGB(cyan,pink,colorProgress,b.front?.14:.08));glow.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=glow;ctx.fillRect(-s*3,-s*3,s*6,s*6);
 for(let side of [-1,1]){
   ctx.save();ctx.scale(side*flap,1);
   let gr=ctx.createLinearGradient(0,-s*.8,s*.7,s*.5);
   gr.addColorStop(0,pale);gr.addColorStop(.5,c);gr.addColorStop(1,mixRGB(cyan,pink,colorProgress,.18));
   ctx.fillStyle=gr;ctx.shadowColor=mixRGB(cyan,pink,colorProgress,.58);ctx.shadowBlur=b.front?7:4.5;
   ctx.beginPath();ctx.moveTo(0,0);
   ctx.bezierCurveTo(s*.05,-s*.5,s*.76,-s*1.47,s*1.17,-s*.71);
   ctx.bezierCurveTo(s*1.3,-s*.3,s*.53,-s*.02,0,0);ctx.fill();
   ctx.beginPath();ctx.moveTo(0,0);
   ctx.bezierCurveTo(s*.73,-s*.2,s*.90,s*.91,s*.41,s*.93);
   ctx.bezierCurveTo(s*.13,s*.98,-s*.11,s*.38,0,0);ctx.fill();ctx.restore();
 }
 ctx.shadowBlur=0;ctx.fillStyle=pale;ctx.beginPath();ctx.ellipse(0,0,s*.10,s*.48,0,0,TAU);ctx.fill();ctx.restore();
}
function renderRain(t){rctx.clearRect(0,0,W,H);rctx.save();rctx.lineCap='round';
 for(let d of droplets){const x=(d.x-t*d.speed*.13+W*120)%W,y=(d.y+t*d.speed)%(H+30)-30;
   rctx.strokeStyle=`rgba(174,217,235,${d.alpha})`;rctx.lineWidth=.65;
   rctx.beginPath();rctx.moveTo(x,y);rctx.lineTo(x-2.0,y+d.len);rctx.stroke();}
 rctx.restore();}
function getHue(t){return birthday?smooth((t-birthdayAt)/9.9):0}
let start=performance.now();
function tick(ts){const t=(ts-start)/1000;
 bctx.clearRect(0,0,W,H);fctx.clearRect(0,0,W,H);
 const h=getHue(t);
 for(let b of butterflies){butterfly(b.front?fctx:bctx,b,t,h)}
 renderRain(t);
 if(!reduced)requestAnimationFrame(tick);
}
function fmt(ms){return new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Lima',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms)).replace(' ','T')}
function reset(newDate){deadline=newDate;birthday=false;birthdayAt=0;root.classList.remove('birthday');void root.offsetWidth;updateClock()}
function celebrate(){if(birthday)return;birthday=true;birthdayAt=(performance.now()-start)/1000;root.classList.add('birthday')}
function updateClock(){const remaining=Math.max(0,deadline-Date.now()),sec=Math.ceil(remaining/1000);
 $('days').textContent=String(Math.floor(sec/86400)).padStart(2,'0');
 $('hours').textContent=String(Math.floor(sec/3600)%24).padStart(2,'0');
 $('minutes').textContent=String(Math.floor(sec/60)%60).padStart(2,'0');
 $('seconds').textContent=String(sec%60).padStart(2,'0');
 if(remaining===0)celebrate();
}
if(DEMO){root.classList.add('demo');$('dateControl').value=fmt(deadline);
 $('trigger').addEventListener('click',()=>{deadline=Date.now()-1;updateClock()});
 $('reset').addEventListener('click',()=>{reset(Date.now()+40000);$('dateControl').value=fmt(deadline)});
 $('setDate').addEventListener('click',()=>{const v=$('dateControl').value;if(!v)return;const date=new Date(v+':00-05:00').getTime();if(Number.isFinite(date))reset(date)});
}
initScene();updateClock();requestAnimationFrame(tick);setInterval(updateClock,250);
})();
</script>
